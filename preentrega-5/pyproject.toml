[project]
name = "react-agent"
version = "0.1.0"
description = "Agente ReAct con LangGraph y memoria persistente en SQLite (Pre-entrega 5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "groq",
    "langchain-core",
    "langchain-groq",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
