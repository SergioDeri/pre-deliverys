[project]
name = "llm-client"
version = "0.1.0"
description = "Cliente asíncrono unificado para LLMs (Pre-entrega 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
